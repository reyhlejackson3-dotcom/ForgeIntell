<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Payment Planner — ForgeINTELLAI Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Share+Tech+Mono&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--orange:#e8520a;--orange-glow:rgba(232,82,10,.35);--orange-dim:rgba(232,82,10,.12);--black:#050505;--dark:#0d0d0d;--grey:#1e1e1e;--metal:#2c2c2c;--light-grey:#888;--lighter-grey:#b8b8b8;--white:#e4e4e4;--font-head:'Barlow Condensed',sans-serif;--font-mono:'Share Tech Mono',monospace;--font-body:'Barlow',sans-serif}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--black);color:var(--white);font-family:var(--font-body);min-height:100vh}
.demo-nav{background:rgba(5,5,5,.95);border-bottom:1px solid var(--grey);padding:1rem 4vw;display:flex;align-items:center;justify-content:space-between}
.logo-link{font-family:var(--font-head);font-weight:900;font-size:1.3rem;text-decoration:none;text-transform:uppercase}
.logo-forge{color:#b8b8b8}.logo-intell{color:#b8b8b8}.logo-ai{color:var(--orange)}
.back-btn{font-family:var(--font-mono);font-size:.78rem;letter-spacing:.1em;color:var(--light-grey);text-decoration:none;text-transform:uppercase;transition:color .2s}.back-btn:hover{color:var(--orange)}
.demo-badge{background:var(--orange);color:#fff;font-family:var(--font-mono);font-size:.7rem;letter-spacing:.15em;padding:.3rem .9rem}
.demo-header{text-align:center;padding:4rem 4vw 2rem;border-bottom:1px solid var(--grey)}
.demo-label{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.15em;color:var(--orange);margin-bottom:.75rem}
.demo-title{font-family:var(--font-head);font-size:clamp(2.5rem,6vw,4.5rem);font-weight:900;text-transform:uppercase;margin-bottom:.75rem}
.demo-sub{font-family:var(--font-mono);font-size:.85rem;color:var(--light-grey);letter-spacing:.08em}
.demo-body{max-width:820px;margin:3rem auto;padding:0 4vw 4rem}
.form-card{background:var(--dark);border:1px solid var(--grey);padding:2.5rem;margin-bottom:2rem}
.form-section-title{font-family:var(--font-head);font-size:1.4rem;font-weight:800;text-transform:uppercase;margin-bottom:1.5rem;letter-spacing:.03em}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.5rem}
.form-group{display:flex;flex-direction:column;gap:.4rem}
label{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.12em;color:var(--light-grey);text-transform:uppercase}
input{background:#0a0a0a;border:1px solid var(--metal);color:var(--white);font-family:var(--font-body);font-size:.95rem;padding:.75rem 1rem;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;border-radius:0}
input:focus{border-color:var(--orange);box-shadow:0 0 12px var(--orange-dim)}
input::placeholder{color:var(--metal)}
.btn-orange{display:block;background:var(--orange);color:#fff;font-family:var(--font-head);font-weight:800;font-size:1.1rem;letter-spacing:.1em;text-transform:uppercase;padding:.85rem 2rem;border:none;cursor:pointer;width:100%;margin-top:.5rem;transition:background .2s,box-shadow .2s}
.btn-orange:hover{background:#ff6820;box-shadow:0 0 24px var(--orange-glow)}
.result-card{background:var(--dark);border:1px solid var(--orange);padding:2.5rem;display:none;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.result-header{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.15em;color:var(--orange);margin-bottom:1.5rem}
.project-cost-display{font-family:var(--font-head);font-size:clamp(1.8rem,5vw,3rem);font-weight:900;color:var(--lighter-grey);margin-bottom:.4rem}
.deposit-display{font-family:var(--font-mono);font-size:.82rem;color:var(--light-grey);margin-bottom:2rem}
.plans-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem}
.plan-card{background:#0a0a0a;border:1px solid var(--grey);padding:1.5rem;text-align:center;transition:border-color .3s,transform .2s;cursor:default}
.plan-card:hover{border-color:var(--orange);transform:translateY(-3px)}
.plan-card.featured{border-color:var(--orange);background:rgba(232,82,10,.06)}
.plan-term{font-family:var(--font-mono);font-size:.72rem;letter-spacing:.12em;color:var(--light-grey);margin-bottom:.5rem}
.plan-payment{font-family:var(--font-head);font-size:2.2rem;font-weight:900;color:var(--white);line-height:1}
.plan-per{font-family:var(--font-mono);font-size:.72rem;color:var(--light-grey)}
.plan-total{font-family:var(--font-mono);font-size:.72rem;color:var(--metal);margin-top:.5rem}
.plan-interest{font-family:var(--font-mono);font-size:.7rem;color:var(--orange);margin-top:.25rem}
.disclaimer{font-family:var(--font-mono);font-size:.68rem;color:var(--metal);letter-spacing:.06em;text-align:center;margin-top:1.5rem}
.range-wrapper{position:relative;margin-top:.5rem}
.range-input{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:var(--grey);outline:none;margin-top:.5rem}
.range-input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:var(--orange);cursor:pointer;border-radius:0;clip-path:polygon(0 0,calc(100% - 4px) 0,100% 4px,100% 100%,4px 100%,0 calc(100% - 4px))}
.range-val{font-family:var(--font-mono);font-size:.75rem;color:var(--orange);margin-top:.4rem}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="demo-nav">
  <a href="index.html" class="logo-link"><span class="logo-forge">Forge</span><span class="logo-intell">INTELL</span><span class="logo-ai">AI</span></a>
  <span class="demo-badge">LIVE DEMO</span>
  <a href="index.html" class="back-btn">← Back to Lobby</a>
</nav>

<div class="demo-header">
  <div class="demo-label">// SYS-003</div>
  <h1 class="demo-title">Job Payment Planner</h1>
  <p class="demo-sub">From $500/month — Turn sticker shock into a yes</p>
</div>

<div class="demo-body">
  <div class="form-card">
    <div class="form-section-title">Enter Project Details</div>
    <form id="payForm" onsubmit="calcPayment(event)">
      <div class="form-grid">
        <div class="form-group">
          <label>Total Project Cost ($)</label>
          <input type="number" id="pCost" placeholder="12500" min="500" step="100" required>
        </div>
        <div class="form-group">
          <label>Deposit Amount ($)</label>
          <input type="number" id="pDeposit" placeholder="2500" min="0" step="100">
        </div>
        <div class="form-group">
          <label>Annual Interest Rate (%)</label>
          <input type="number" id="pRate" placeholder="9.9" min="0" max="36" step="0.1">
        </div>
        <div class="form-group">
          <label>Business Name (optional)</label>
          <input type="text" id="pBiz" placeholder="Peak Roofing Co">
        </div>
      </div>
      <button type="submit" class="btn-orange">Show Payment Options →</button>
    </form>
  </div>

  <div class="result-card" id="payResult">
    <div class="result-header" id="resultHeader">// PAYMENT OPTIONS — POWERED BY FORGEINTELLAI</div>
    <div class="project-cost-display" id="costDisplay">$0</div>
    <div class="deposit-display" id="depositDisplay"></div>
    <div class="plans-grid" id="plansGrid"></div>
    <div class="disclaimer">Financing terms shown for illustration. Actual rates subject to lender approval. Powered by ForgeINTELLAI.</div>
  </div>
</div>

<script>
function fmt(n){return '$'+Math.round(n).toLocaleString();}
function fmtD(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}

function monthlyPayment(principal,annualRate,months){
  if(annualRate===0) return principal/months;
  const r=annualRate/100/12;
  return principal*(r*Math.pow(1+r,months))/(Math.pow(1+r,months)-1);
}

function calcPayment(e){
  e.preventDefault();
  const cost    = parseFloat(document.getElementById('pCost').value)||0;
  const deposit = parseFloat(document.getElementById('pDeposit').value)||0;
  const rate    = parseFloat(document.getElementById('pRate').value)||9.9;
  const biz     = document.getElementById('pBiz').value||'Your Business';
  const financed= Math.max(0, cost - deposit);

  document.getElementById('costDisplay').textContent = fmt(cost) + ' total project';
  document.getElementById('depositDisplay').textContent =
    deposit > 0 ? `${fmt(deposit)} deposit · ${fmt(financed)} financed · ${rate}% APR`
                : `No deposit · Full amount financed · ${rate}% APR`;
  document.getElementById('resultHeader').textContent = `// PAYMENT OPTIONS — ${biz.toUpperCase()}`;

  const terms = [12, 18, 24, 36, 48, 60];
  const featured = 24;
  const grid = document.getElementById('plansGrid');
  grid.innerHTML = '';

  terms.forEach(t => {
    const mo = monthlyPayment(financed, rate, t);
    const totalPaid = mo*t + deposit;
    const interest = totalPaid - cost;
    const isFeat = t===featured;
    grid.innerHTML += `
      <div class="plan-card${isFeat?' featured':''}">
        <div class="plan-term">${t} MONTHS</div>
        <div class="plan-payment">${fmtD(mo)}</div>
        <div class="plan-per">/month</div>
        <div class="plan-total">Total: ${fmt(totalPaid)}</div>
        <div class="plan-interest">+${fmt(interest)} interest</div>
      </div>`;
  });

  const r=document.getElementById('payResult');
  r.style.display='block';
  setTimeout(()=>r.scrollIntoView({behavior:'smooth',block:'start'}),100);
}
</script>
</body>
</html>
